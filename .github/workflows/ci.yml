name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
  
      - name: Set up Rust
        uses: moonrepo/setup-rust@v1
        with:
          targets: wasm32-unknown-unknown
          cache-target: wasm32-unknown-debug, unknown

      - name: Install Rust tools
        uses: moonrepo/setup-rust@v1
        env:                                       
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bins: >
            just,
            tytanic
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python Libraries
        run: python -m pip install numpy

      - name: Run test suite
        run: |
          python --version
          tt --version
          just testonly
    
  lints:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
  
      - name: Set up Rust
        uses: moonrepo/setup-rust@v1
        with:
          targets: wasm32-unknown-unknown
          cache-target: wasm32-unknown-debug, unknown
          components: clippy

      - name: Install Rust tools
        uses: moonrepo/setup-rust@v1
        env:                                       
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bins: >
            just,
            typstyle

      - name: Run lint suite
        run: |
          typstyle --version
          just lint
