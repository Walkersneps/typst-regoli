[package]
name = "regoli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
ciborium = "0.2"
half = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-minimal-protocol = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
